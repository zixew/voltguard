name: macOS CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show macOS, Swift and Xcode version
        run: |
          sw_vers
          uname -m
          swift --version
          xcodebuild -version

      - name: Build Debug Targets
        run: swift build

      - name: Run Unit Tests
        run: swift test

      - name: Package Universal App and DMG
        if: matrix.os == 'macos-26'
        env:
          CI: "true"
        run: |
          bash scripts/package_dmg.sh
          lipo -info dist/VoltGuard.app/Contents/MacOS/VoltGuard dist/VoltGuard.app/Contents/Helpers/voltguard-helper

      - name: Upload VoltGuard DMG Artifact
        if: matrix.os == 'macos-26'
        uses: actions/upload-artifact@v7
        with:
          name: VoltGuard-macOS-DMG
          path: dist/VoltGuard.dmg
          if-no-files-found: error

      - name: Publish GitHub Release on Tag
        if: matrix.os == 'macos-26' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" dist/VoltGuard.dmg --title "VoltGuard $TAG_NAME" --generate-notes
